function chip(e){return`<div class="chip" data-id="${e.id}" style="border-left:5px solid ${C[S.employees.indexOf(e)%C.length]}">☰ <b>${e.name}</b></div>`}function openEdit(d){if($('editorBackdrop').dataset.allowed!=='1')return;editDate=d;$('editDate').textContent=fmt(d);$('editorBackdrop').classList.add('open');document.body.style.overflow='hidden';drawEdit()}function closeEdit(){editDate=null;$('editorBackdrop').classList.remove('open');document.body.style.overflow=''}function drawEdit(){let d=new Date(editDate+'T12:00'),used=new Set();[['s0530','05:30'],['s0700','07:00'],['s0900','09:00']].forEach(([id,t])=>{let e=S.employees.find(x=>shift(x,d)===t);$(id).innerHTML=e?chip(e):'';if(e)used.add(e.id)});$('pool').innerHTML=S.employees.filter(e=>!used.has(e.id)).map(chip).join('');lists.forEach(x=>x.destroy());lists=[];['s0530','s0700','s0900','pool'].forEach(id=>lists.push(new Sortable($(id),{group:'day',animation:160,draggable:'.chip',forceFallback:true,onAdd:e=>{if(id!=='pool'&&e.to.children.length>1){let old=e.to.children[0];if(old!==e.item)$('pool').appendChild(old)}}})))}function assignment(){return[['s0530','05:30'],['s0700','07:00'],['s0900','09:00']].map(([id,time])=>({id:$(id).querySelector('.chip')?.dataset.id,time})).filter(x=>x.id)}function setDate(d){S.employees.forEach(e=>S.overrides=S.overrides.filter(x=>!(x.date===d&&x.employee_id===e.id)));assignment().forEach(x=>S.overrides.push({date:d,employee_id:x.id,time:x.time}));[...$('pool').querySelectorAll('.chip')].forEach(x=>S.overrides.push({date:d,employee_id:x.dataset.id,time:'OFF'}))}async function saveDay(){if(!editDate)return;let selected=editDate;setDate(selected);closeEdit();await save()}async function saveWeek(){if(!editDate)return;let m=mon(new Date(editDate+'T12:00'));for(let i=0;i<7;i++)setDate(iso(add(m,i)));closeEdit();await save()}
async function deleteOwnRejected(id){let own=S.employees.find(x=>x.name.toLowerCase()===(P?.full_name||'').toLowerCase()),r=S.leaveRequests.find(x=>x.id===id);if(!own||!r||r.employee_id!==own.id||r.status!=='rejected')return;S.leaveRequests=S.leaveRequests.filter(x=>x.id!==id);await save();toast(tr('deleted'))}async function requestLeave(){let f=$('from').value,t=$('to').value;if(!f||!t||t<f)return;let own=S.employees.find(e=>e.name.toLowerCase()===(P.full_name||'').toLowerCase()),id=P.role==='worker'?own.id:$('leaveEmp').value;S.leaveRequests.push({id:crypto.randomUUID(),employee_id:id,from:f,to:t,status:'pending'});await save()}async function decide(id,status){let r=S.leaveRequests.find(x=>x.id===id);r.status=status;if(status==='approved')for(let d=new Date(r.from+'T12:00');iso(d)<=r.to;d=add(d,1)){S.overrides=S.overrides.filter(x=>!(x.date===iso(d)&&x.employee_id===r.employee_id));S.overrides.push({date:iso(d),employee_id:r.employee_id,time:'OFF'})}await save()}function team(id){$('teamList').innerHTML=S.leaveRequests.filter(r=>r.employee_id===id&&r.status==='approved').map(req).join('')||'—'}
function exportExcel(){let wb=XLSX.utils.book_new(),rows=[],m=mon();for(let d=m;d<=add(m,365);d=add(d,1))S.employees.forEach(e=>rows.push({Date:fmt(d),Week:weekNo(d),Employee:e.name,Shift:shown(e,d)}));XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Schedule');XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['ShiftControlV51'],[JSON.stringify(S)]]),'BackupJSON');XLSX.writeFile(wb,'ShiftControl_v5.1_'+iso(new Date())+'.xlsx')}async function importExcel(e){try{let wb=XLSX.read(await e.target.files[0].arrayBuffer()),a=XLSX.utils.sheet_to_json(wb.Sheets.BackupJSON,{header:1});if(a[0][0]!=='ShiftControlV51')throw 0;S=JSON.parse(a[1][0]);await save()}catch{toast('Invalid backup','warn')}e.target.value=''}
async function publish(){if(!P||!['admin','supervisor'].includes(P.role))return;let m=mon(),week=[];for(let i=0;i<7;i++){let d=add(m,i);week.push({date:iso(d),label:fmt(d),en:d.toLocaleDateString('en-GB',{weekday:'short'}),no:d.toLocaleDateString('nb-NO',{weekday:'short'}),shifts:S.employees.map(e=>({name:e.name,time:shown(e,d)})).filter(x=>x.time!=='OFF')})}let td=week.find(x=>x.date===iso(new Date())),early=td?.shifts.find(x=>x.time==='05:30');await sb.from('public_status').upsert({id:1,work_date:iso(new Date()),early_name:early?.name||'',early_time:'05:30',workers:{today:td?.shifts||[],week},updated_at:new Date().toISOString()})}async function publicLoad(){let{data}=await sb.from('public_status').select('*').eq('id',1).limit(1).maybeSingle();window.PUB=data;renderPublic()}function renderPublic(){let no=pubLang==='no',w=window.PUB?.workers||{},week=Array.isArray(w.week)?w.week:[];$('pubTitle').textContent=no?'Hvem er på jobb i dag?':'Who is at work today?';$('pubText').textContent=no?'Ring personen som starter kl. 05:30:':'Call the person starting at 05:30:';$('pubWeekTitle').textContent=no?'Forventet plan denne uken':'Expected schedule this week';$('pubDate').textContent=fmt(new Date());$('pubWho').textContent=window.PUB?.early_name||'—';$('pubWeek').innerHTML=week.map(d=>`<div class="publicDay"><b>${no?d.no:d.en} ${d.label}</b>${d.shifts.map(x=>`<div class="publicShift">${x.name}: ${x.time==='VAKT'?'Vakt':x.time==='09:00'?'09:00 + Vakt':x.time}</div>`).join('')}</div>`).join('')}
