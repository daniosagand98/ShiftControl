<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ShiftControl v3.1</title><style>:root{--b:#17649b;--n:#173f5f;--r:#d94b3d;--g:#278b69;--bg:#f3f7fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px system-ui;color:#18364d}header{background:linear-gradient(135deg,var(--n),var(--b));color:#fff;padding:15px}.bar,main{max-width:1000px;margin:auto}.bar{display:flex;align-items:center;gap:9px}.brand{font-size:21px;font-weight:850;flex:1}.card{background:#fff;border-radius:18px;padding:16px;margin:14px 0;box-shadow:0 6px 22px #173f5f14}.btn{border:0;border-radius:11px;padding:10px 13px;background:var(--b);color:#fff;font-weight:750}.alt{background:#e6eef5;color:var(--n)}input,select{width:100%;padding:10px;border:1px solid #d7e2eb;border-radius:10px}.field{margin:9px 0}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.day{border:1px solid #d7e2eb;border-radius:12px;padding:8px;min-height:115px}.shift{font-size:12px;background:#e6f5f1;padding:5px;border-radius:7px;margin:4px 0}.red{background:#fff0ed}.tabs{display:flex;gap:8px;flex-wrap:wrap}.view{display:none}.view.on{display:block}.item{border:1px solid #d7e2eb;border-radius:11px;padding:10px;margin:7px 0}.gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,var(--n),var(--b));z-index:9;padding:18px}.gate.hide{display:none}.login{background:#fff;border-radius:22px;padding:22px;width:min(430px,100%)}.publicHero{text-align:center;padding:25px}.who{font-size:34px;font-weight:900;color:var(--b)}.badge{padding:5px 9px;border-radius:99px;background:#fff0bd;color:#725700;font-weight:700}.row{display:flex;gap:9px}.muted{color:#667b8d;font-size:12px}@media(max-width:760px){.grid{grid-template-columns:1fr}.row{flex-direction:column}}</style></head><body><div id="gate" class="gate"><div class="login"><h1>📅 ShiftControl</h1><div class="field">Imię<input id="name"></div><div class="field">E-mail<input id="email" type="email"></div><div class="field">Hasło<input id="pass" type="password"></div><div class="row"><button class="btn" onclick="login()">Zaloguj</button><button class="btn alt" onclick="signup()">Utwórz konto</button></div><p id="msg"></p></div></div><header><div class="bar"><div class="brand">📅 ShiftControl v3.1</div><span id="role" class="badge"></span><button class="btn alt" onclick="logout()">Wyloguj</button></div></header><main><div class="tabs" id="tabs"><button class="btn" onclick="show('home')">Grafik</button><button class="btn worker" onclick="show('leave')">Wolne</button><button class="btn admin" onclick="show('admin')">Administracja</button></div><section id="home" class="view on"><div class="card"><h2>Grafik tygodnia</h2><div class="row"><button class="btn alt" onclick="move(-1)">‹</button><b id="week"></b><button class="btn alt" onclick="move(1)">›</button></div><div id="cal" class="grid"></div></div><div class="card"><b>Publiczny podgląd dla firmy:</b><div><a id="publicLink" target="_blank"></a></div></div></section><section id="leave" class="view"><div class="card"><h2>Zgłoś wolne</h2><select id="emp"></select><div class="row"><input id="from" type="date"><input id="to" type="date"></div><button class="btn" onclick="leave()">Zapisz</button></div></section><section id="admin" class="view"><div class="card"><h2>Panel administratora Daniela</h2><h3>Role użytkowników</h3><div id="users"></div></div><div class="card"><h3>Edycja grafiku</h3><div class="row"><input id="odate" type="date"><select id="oemp"></select><select id="otime"><option>05:30</option><option>07:00</option><option>09:00</option><option>Wolne</option></select></div><button class="btn" onclick="overrideShift()">Zapisz zmianę</button><div id="overrides"></div></div></section><section id="public" class="view"><div class="card publicHero"><h1>Kto jest dziś w pracy?</h1><div id="publicDate"></div><div id="publicWho" class="who"></div><p id="publicText"></p><div id="publicAll"></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
let sb,user,profile,state={employees:[{id:'daniel',name:'Daniel',rotation:0},{id:'adam',name:'Adam',rotation:1},{id:'kevin',name:'Kevin',rotation:2}],leaves:[],overrides:[]},off=0;const $=x=>document.getElementById(x),iso=d=>{let x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10)},add=(d,n)=>{let x=new Date(d);x.setDate(x.getDate()+n);return x},mon=(d=new Date())=>{let x=new Date(d),n=(x.getDay()+6)%7;x.setDate(x.getDate()-n+off*7);x.setHours(12,0,0,0);return x};function baseShift(e,d){let w=Math.round((mon(d)-mon(new Date('2026-09-21T12:00:00')))/604800000);return['05:30','07:00','09:00'][((e.rotation+w)%3+3)%3]}function shift(e,d){let o=state.overrides.find(x=>x.date===iso(d)&&x.employee_id===e.id);return o?o.time:baseShift(e,d)}function init(){sb=supabase.createClient(SHIFT.url,SHIFT.key)}function show(id){document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));$(id).classList.add('on')}async function signup(){try{let{error}=await sb.auth.signUp({email:$('email').value,password:$('pass').value,options:{emailRedirectTo:location.origin+location.pathname,data:{full_name:$('name').value}}});if(error)throw error;$('msg').textContent='Sprawdź e-mail'}catch(e){$('msg').textContent=e.message}}async function login(){let{data,error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('pass').value});if(error)return $('msg').textContent=error.message;enter(data.user)}async function enter(u){user=u;let{data:p,error}=await sb.from('profiles').select('*').eq('id',u.id).single();if(error)return $('msg').textContent=error.message;profile=p;let{data:a}=await sb.from('app_state').select('payload').eq('id',1).maybeSingle();if(a?.payload)state=a.payload;$('gate').classList.add('hide');$('role').textContent=p.role;document.querySelectorAll('.admin').forEach(x=>x.style.display=p.role==='admin'?'block':'none');document.querySelectorAll('.worker').forEach(x=>x.style.display=['admin','worker'].includes(p.role)?'block':'none');render();if(p.role==='admin')loadUsers()}async function save(){let{error}=await sb.from('app_state').upsert({id:1,payload:state});if(error)alert(error.message);await publish();render()}async function publish(){let d=new Date(),workers=state.employees.map(e=>({name:e.name,time:shift(e,d)})).filter(x=>x.time!=='Wolne');let early=workers.find(x=>x.time==='05:30');await sb.from('public_status').upsert({id:1,work_date:iso(d),early_name:early?.name||'',early_time:'05:30',workers,updated_at:new Date().toISOString()})}function move(n){off+=n;render()}function render(){let m=mon();$('week').textContent=iso(m)+' – '+iso(add(m,6));$('cal').innerHTML=[0,1,2,3,4,5,6].map(i=>{let d=add(m,i);return`<div class="day"><b>${iso(d)}</b>${state.employees.map(e=>`<div class="shift ${shift(e,d)==='Wolne'?'red':''}">${e.name}: ${shift(e,d)}</div>`).join('')}</div>`}).join('');$('emp').innerHTML=$('oemp').innerHTML=state.employees.map(e=>`<option value="${e.id}">${e.name}</option>`).join('');$('overrides').innerHTML=state.overrides.map(x=>`<div class="item">${x.date} • ${state.employees.find(e=>e.id===x.employee_id)?.name}: ${x.time}</div>`).join('');let link=location.origin+location.pathname+'?public=1';$('publicLink').href=link;$('publicLink').textContent=link}function leave(){if(!['admin','worker'].includes(profile.role))return;state.leaves.push({employee_id:$('emp').value,from:$('from').value,to:$('to').value});for(let d=new Date($('from').value+'T12:00');iso(d)<=$('to').value;d=add(d,1))state.overrides.push({date:iso(d),employee_id:$('emp').value,time:'Wolne'});save()}function overrideShift(){if(profile.role!=='admin')return;state.overrides=state.overrides.filter(x=>!(x.date===$('odate').value&&x.employee_id===$('oemp').value));state.overrides.push({date:$('odate').value,employee_id:$('oemp').value,time:$('otime').value});save()}async function loadUsers(){let{data}=await sb.from('profiles').select('*').order('full_name');$('users').innerHTML=data.map(p=>`<div class="item"><b>${p.full_name||p.email}</b><select onchange="setRole('${p.id}',this.value)"><option ${p.role==='viewer'?'selected':''} value="viewer">Podgląd</option><option ${p.role==='worker'?'selected':''} value="worker">Pracownik</option><option ${p.role==='admin'?'selected':''} value="admin">Administrator</option></select></div>`).join('')}async function setRole(id,r){let{error}=await sb.rpc('admin_set_role',{target_id:id,new_role:r});if(error)alert(error.message);else loadUsers()}async function publicMode(){show('public');$('gate').classList.add('hide');document.querySelector('header').style.display='none';$('tabs').style.display='none';let{data,error}=await sb.from('public_status').select('*').eq('id',1).single();if(error)return $('publicText').textContent=error.message;$('publicDate').textContent=data.work_date;$('publicWho').textContent=data.early_name||'Brak danych';$('publicText').textContent=(data.early_name||'Ta osoba')+' zaczyna o 05:30. W razie problemu skontaktuj się z tą osobą.';$('publicAll').innerHTML=(data.workers||[]).map(x=>`<div class="item">${x.name}: ${x.time}</div>`).join('')}async function logout(){await sb.auth.signOut();location.reload()}init();if(new URLSearchParams(location.search).has('public'))publicMode();else sb.auth.getSession().then(x=>{if(x.data.session)enter(x.data.session.user)});
</script></body></html>
