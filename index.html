<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ShiftControl v6.0.1</title><style>
*{box-sizing:border-box}:root{--b:#1e6fa1;--n:#123b5d;--bg:#f2f6fa;--line:#d7e3ec}body{margin:0;background:var(--bg);font:15px system-ui;color:#17364c}header{height:68px;background:linear-gradient(135deg,var(--n),var(--b));color:#fff;display:flex;align-items:center;gap:10px;padding:12px;position:sticky;top:0;z-index:20}.brand{flex:1;font-size:20px;font-weight:900}.icon,.btn{border:0;border-radius:10px;padding:10px 13px;background:var(--b);color:#fff;font-weight:800}.icon{border:1px solid #ffffff55;background:#ffffff18}.alt{background:#e8f0f6;color:var(--n)}.drawer{position:fixed;top:68px;bottom:0;left:-280px;width:270px;background:#fff;z-index:50;padding:14px;transition:.2s}.drawer.open{left:0}.shade{display:none;position:fixed;inset:68px 0 0;background:#09243691;z-index:40}.shade.open{display:block}.menu button{display:block;width:100%;border:0;background:#fff;text-align:left;padding:12px;border-radius:10px;font-weight:750}.menu button.on{background:#e7f2f9;color:var(--b)}main{max-width:1100px;margin:auto;padding:16px}.view{display:none}.view.on{display:block}.card{background:#fff;border-radius:18px;padding:17px;margin-bottom:15px;box-shadow:0 10px 30px #17364c14}.row{display:flex;align-items:center;gap:10px}.grow{flex:1}.field{min-width:0;margin:9px 0}.field label{display:block;color:#6a8090;font-size:12px}.field input,.field select{display:block;width:100%;max-width:100%;min-width:0;padding:11px;border:1px solid var(--line);border-radius:11px;font:inherit}.weekHead{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}.badge{background:#e7f2f9;color:var(--b);padding:6px 11px;border-radius:99px;font-weight:900}.dateJump{position:relative;display:inline-flex;gap:6px;align-items:center;padding:7px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer}.dateJump input{position:absolute;inset:0;width:100%;height:100%;opacity:0}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:12px}.day{border:1px solid var </style></head><body><div id="toast" class="toast"></div><div id="gate" class="gate"><div class="login"><div class="row"><h1 class="grow">📅 ShiftControl</h1><button class="btn alt" data-lang="pl">🇵🇱</button><button class="btn alt" data-lang="no">🇳🇴</button></div><p data-i="intro">Zaloguj się lub utwórz konto</p><div class="field"><label data-i="name">Imię</label><input id="name"></div><div class="field"><label>E-mail</label><input id="email"></div><div class="field"><label data-i="pass">Hasło</label><input id="pass" type="password"></div><button class="btn" onclick="login()" data-i="login">Zaloguj</button> <button class="btn alt" onclick="signup()" data-i="signup">Utwórz konto</button><p id="msg"></p></div></div>
<header><button id="menuBtn" class="icon">☰</button><div class="brand">📅 ShiftControl v6.0.1</div><button class="icon" data-lang="pl">🇵🇱</button><button class="icon" data-lang="no">🇳🇴</button></header><div id="shade" class="shade"></div><aside id="drawer" class="drawer"><b id="pname"></b><div id="prole"></div><nav class="menu"><button data-page="home" class="on" data-i="home">🏠 Start</button><button data-page="schedule" data-i="schedule">📅 Grafik</button><button data-page="leave" data-i="leave">🏖️ Wolne</button><button data-page="team" data-i="team">👥 Wolne zespołu</button><button data-page="approvals" class="manager" data-i="approvals">✅ Wnioski</button><button id="publicBtn" data-i="public">🔗 Publiczny podgląd</button><button onclick="logout()" data-i="logout">🚪 Wyloguj</button></nav></aside>
<main><section id="home" class="view on"><div class="card"><h2 data-i="tomorrow">Jutro zaczynasz:</h2><div id="tomorrow"></div></div><div class="card"><h2 data-i="upcoming">🏖️ Nadchodzące wolne</h2><div id="future"></div></div></section><section id="schedule" class="view"><div class="card"><div class="row"><button class="btn alt" onclick="move(-1)">‹</button><div id="weekHead" class="weekHead grow"></div><button class="btn alt" onclick="move(1)">›</button></div><div id="week" class="week"></div></div><div class="card manager"><button class="btn" onclick="exportExcel()">📤 Excel</button> <label class="btn alt">📥 Import<input hidden type="file" accept=".xlsx" onchange="importExcel(event)"></label></div></section><section id="leave" class="view"><div class="card"><h2 data-i="request">🏖️ Wyślij wniosek</h2><select id="leaveEmp"></select><div class="dates"><div class="field"><label data-i="from">Od</label><input id="from" type="date"></div><div class="field"><label data-i="to">Do</label><input id="to" type="date"></div></div><button class="btn" onclick="requestLeave()" data-i="send">Wyślij</button></div><div class="card"><h2 data-i="my">📋 Moje wnioski</h2><div id="myReq"></div></div></section><section id="team" class="view"><div class="card"><h2 data-i="team">👥 Wolne zespołu</h2><div id="teamBtns"></div><div id="teamList"></div></div></section><section id="approvals" class="view"><div class="card"><h2 data-i="approvals">✅ Wnioski</h2><div id="pending"></div></div></section></main>
<div id="editorShade" class="modalShade"><div class="modal"><div class="row"><h2 class="grow"><span data-i="staff">Ustaw obsadę</span>: <span id="editDate"></span></h2><button id="closeEditor" class="btn alt">✕</button></div><p data-i="drag">Przeciągnij osoby. Produkcję weekendową można ustawić ręcznie.</p><div class="slots"><div class="slot"><h3>05:30</h3><div id="s0530" class="drop"></div></div><div class="slot"><h3>07:00</h3><div id="s0700" class="drop"></div></div><div class="slot"><h3>09:00 + Vakt</h3><div id="s0900" class="drop"></div></div></div><h3 data-i="available">Dostępne / wolne</h3><div id="pool" class="pool"></div><div class="actions"><button class="btn" onclick="saveDay()" data-i="day">Zastosuj dla dnia</button><button class="btn alt" onclick="saveWeek()" data-i="weekApply">Zastosuj dla tygodnia</button></div></div></div>
<div id="publicPage" style="display:none" class="public"><button class="btn alt" onclick="pubLang='en';renderPublic()">🇬🇧</button><button class="btn alt" onclick="pubLang='no';renderPublic()">🇳🇴</button><div class="card"><h1 id="pubTitle"></h1><h2 id="pubWeekTitle"></h2><div id="pubWeek" class="publicWeek"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.7/Sortable.min.js"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="config.js"></script><script>
'use strict';const $=x=>document.getElementById(x),TR={pl:{intro:'Zaloguj się lub utwórz konto',name:'Imię',pass:'Hasło',login:'Zaloguj',signup:'Utwórz konto',home:'🏠 Start',schedule:'📅 Grafik',leave:'🏖️ Wolne',team:'👥 Wolne zespołu',approvals:'✅ Wnioski',public:'🔗 Publiczny podgląd',logout:'🚪 Wyloguj',tomorrow:'Jutro zaczynasz:',upcoming:'🏖️ Nadchodzące wolne',request:'🏖️ Wyślij wniosek',from:'Od',to:'Do',send:'Wyślij',my:'📋 Moje wnioski',staff:'Ustaw obsadę',drag:'Przeciągnij osoby. Produkcję weekendową można ustawić ręcznie.',available:'Dostępne / wolne',day:'Zastosuj dla dnia',weekApply:'Zastosuj dla tygodnia',week:'Tydzień',pick:'Wybierz datę',vakt:'Vakt',off:'Weekend wolny',pending:'Oczekuje',approved:'Zatwierdzone',rejected:'Odrzucone',del:'🗑 Usuń',saved:'Zapisano'},no:{intro:'Logg inn eller opprett konto',name:'Navn',pass:'Passord',login:'Logg inn',signup:'Opprett konto',home:'🏠 Start',schedule:'📅 Arbeidsplan',leave:'🏖️ Fri',team:'👥 Teamets fridager',approvals:'✅ Søknader',public:'🔗 Offentlig visning',logout:'🚪 Logg ut',tomorrow:'I morgen starter du:',upcoming:'🏖️ Kommende fridager',request:'🏖️ Send søknad',from:'Fra',to:'Til',send:'Send',my:'📋 Mine søknader',staff:'Sett opp bemanning',drag:'Dra personene. Helgeproduksjon kan registreres manuelt.',available:'Tilgjengelige / fri',day:'Bruk for dagen',weekApply:'Bruk for uken',week:'Uke',pick:'Velg dato',vakt:'Vakt',off:'Fri i helgen',pending:'Venter',approved:'Godkjent',rejected:'Avslått',del:'🗑 Slett',saved:'Lagret'}};
let db,P,L=localStorage.shiftLanguage||'pl',offset=0,editDate=null,sorts=[],pubLang='en',S={employees:[{id:'daniel',name:'Daniel',rotation:1},{id:'adam',name:'Adam',rotation:2},{id:'kevin',name:'Kevin',rotation:0}],overrides:[],leaveRequests:[]};const t=k=>TR[L][k]||k,iso=d=>{let x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10)},fmt=d=>{let x=typeof d==='string'?new Date(d+'T12:00'):new Date(d);return String(x.getDate()).padStart(2,'0')+'.'+String(x.getMonth()+1).padStart(2,'0')+'.'+String(x.getFullYear()).slice(-2)},add=(d,n)=>{let x=new Date(d);x.setDate(x.getDate()+n);return x},mon=d=>{let x=new Date(d||new Date()),n=(x.getDay()+6)%7;x.setDate(x.getDate()-n);x.setHours(12,0,0,0);return x},visibleMon=()=>add(mon(),offset*7);function weekNo(d){let x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));x.setUTCDate(x.getUTCDate()+4-(x.getUTCDay()||7));let y=new Date(Date.UTC(x.getUTCFullYear(),0,1));return Math.ceil((((x-y)/86400000)+1)/7)}function base(e,d){let w=Math.round((mon(d)-mon(new Date('2026-09-21T12:00')))/604800000);return['05:30','07:00','09:00'][((e.rotation-w)%3+3)%3]}function override(e,d){return S.overrides.find(x=>x.date===iso(d)&&x.employeeId===e.id)}function raw(e,d){return override(e,d)?.time||base(e,d)}function shift(e,d){let o=override(e,d);if(o)return o.time==='09:00'?'VAKT':o.time;return[0,6].includes(d.getDay())?(base(e,d)==='09:00'?'VAKT':'OFF'):base(e,d)}function ordered(d){let q={'05:30':0,'07:00':1,'09:00':2,'VAKT':2};return S.employees.map((e,i)=>({e,i,s:shift(e,d)})).filter(x=>x.s!=='OFF').sort((a,b)=>(q[a.s]??9)-(q[b.s]??9))}
function language(x){L=x;localStorage.shiftLanguage=x;document.documentElement.lang=x==='no'?'nb':'pl';document.querySelectorAll('[data-i]').forEach(e=>e.textContent=TR[x][e.dataset.i]||e.dataset.i);if(P)render()}document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>language(b.dataset.lang));function toast(x){$('toast').textContent=x;$('toast').className='toast show';setTimeout(()=>$('toast').className='toast',2500)}function menu(x=!$('drawer').classList.contains('open')){$('drawer').classList.toggle('open',x);$('shade').classList.toggle('open',x)}$('menuBtn').onclick=()=>menu();$('shade').onclick=()=>menu(false);$('publicBtn').onclick=()=>window.open(location.origin+location.pathname+'?public=1','_blank');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.view,.menu button').forEach(x=>x.classList.remove('on'));$(b.dataset.page).classList.add('on');b.classList.add('on');menu(false)});$('closeEditor').onclick=closeEdit;$('editorShade').onclick=e=>{if(e.target===$('editorShade'))closeEdit()};
function init(){db=supabase.createClient(SHIFT.url,SHIFT.key,{auth:{persistSession:true,autoRefreshToken:true}})}async function signup(){let{error}=await db.auth.signUp({email:$('email').value,password:$('pass').value,options:{data:{full_name:$('name').value}}});$('msg').textContent=error?error.message:'OK'}async function login(){let{data,error}=await db.auth.signInWithPassword({email:$('email').value,password:$('pass').value});if(error)return $('msg').textContent=error.message;enter(data.user)}async function logout(){await db.auth.signOut();location.reload()}async function enter(u){let{data:p}=await db.from('profiles').select('*').eq('id',u.id).single();P=p;if(!localStorage.shiftLanguage)L=['kevin','kenneth'].includes((p.full_name||'').toLowerCase())?'no':'pl';let{data:a}=await db.from('app_state').select('payload').eq('id',1).maybeSingle();if(a?.payload)S={...S,...a.payload};S.overrides=(S.overrides||[]).map(x=>({date:x.date,employeeId:x.employeeId||x.employee_id,time:x.time}));S.leaveRequests=(S.leaveRequests||[]).map(x=>({...x,employeeId:x.employeeId||x.employee_id}));$('gate').classList.add('hide');$('pname').textContent=p.full_name;$('prole').textContent=p.role;document.querySelectorAll('.manager').forEach(x=>x.style.display=['admin','supervisor'].includes(p.role)?'block':'none');language(L)}async function save(){let payload={...S,overrides:S.overrides.map(x=>({date:x.date,employee_id:x.employeeId,time:x.time})),leaveRequests:S.leaveRequests.map(x=>({...x,employee_id:x.employeeId}))};let{error}=await db.from('app_state').upsert({id:1,payload});if(error)throw error;render();toast(t('saved'))}
function move(n){offset+=n;renderSchedule()}function jumpDate(v){if(!v)return;offset=Math.round((mon(new Date(v+'T12:00'))-mon())/604800000);renderSchedule()}function render(){renderHome();renderSchedule();renderLeave();renderTeam();renderApprovals()}function renderHome(){let d=add(new Date(),1),e=S.employees.find(x=>x.name.toLowerCase()===(P.full_name||'').toLowerCase())||S.employees[0],s=shift(e,d);$('tomorrow').textContent=(s==='OFF'?t('off'):s==='VAKT'?t('vakt'):s)+' • '+fmt(d);let own=S.employees.find(x=>x.name.toLowerCase()===(P.full_name||'').toLowerCase());$('future').innerHTML=S.leaveRequests.filter(r=>r.employeeId===own?.id&&r.status==='approved'&&r.to>=iso(new Date())).map(card).join('')||'—'}function renderSchedule(){let d=visibleMon(),loc=L==='no'?'nb-NO':'pl-PL';$('weekHead').innerHTML=`<span class="badge">${t('week')} ${weekNo(d)}</span><label class="dateJump" title="${t('pick')}">📅 <span>${fmt(d)} – ${fmt(add(d,6))}</span><input type="date" value="${iso(d)}" onchange="jumpDate(this.value)"></label>`;$('week').innerHTML=[0,1,2,3,4,5,6].map(i=>{let x=add(d,i),ed=['admin','supervisor'].includes(P.role);return`<div class="day ${[0,6].includes(x.getDay())?'weekend':''} ${ed?'edit':''}" ${ed?`onclick="openEdit('${iso(x)}')"`:''}><b>${x.toLocaleDateString(loc,{weekday:'short'})} ${fmt(x)}</b>${ordered(x).map(y=>`<div class="shift">${y.e.name}: ${y.s==='VAKT'?t('vakt'):y.s}</div>`).join('')}</div>`}).join('')}
function chip(e){return`<div class="chip" data-id="${e.id}">☰ <b>${e.name}</b></div>`}function openEdit(d){editDate=d;$('editDate').textContent=fmt(d);$('editorShade').classList.add('open');document.body.style.overflow='hidden';drawEdit()}function closeEdit(){editDate=null;$('editorShade').classList.remove('open');document.body.style.overflow=''}function drawEdit(){let d=new Date(editDate+'T12:00'),used=new Set();[['s0530','05:30'],['s0700','07:00'],['s0900','09:00']].forEach(([id,time])=>{let e=S.employees.find(x=>raw(x,d)===time);$(id).innerHTML=e?chip(e):'';if(e)used.add(e.id)});$('pool').innerHTML=S.employees.filter(e=>!used.has(e.id)).map(chip).join('');sorts.forEach(x=>x.destroy());sorts=[];['s0530','s0700','s0900','pool'].forEach(id=>sorts.push(new Sortable($(id),{group:'staff',animation:160,draggable:'.chip',forceFallback:true,onAdd:e=>{if(id!=='pool'&&e.to.children.length>1){let o=e.to.children[0];if(o!==e.item)$('pool').appendChild(o)}}})))}function assign(){return[['s0530','05:30'],['s0700','07:00'],['s0900','09:00']].map(([id,time])=>({employeeId:$(id).querySelector('.chip')?.dataset.id,time})).filter(x=>x.employeeId)}function applyDate(d){S.employees.forEach(e=>S.overrides=S.overrides.filter(x=>!(x.date===d&&x.employeeId===e.id)));assign().forEach(x=>S.overrides.push({date:d,...x}));[...$('pool').querySelectorAll('.chip')].forEach(x=>S.overrides.push({date:d,employeeId:x.dataset.id,time:'OFF'}))}async function saveDay(){applyDate(editDate);closeEdit();await save()}async function saveWeek(){let d=mon(new Date(editDate+'T12:00'));for(let i=0;i<7;i++)applyDate(iso(add(d,i)));closeEdit();await save()}
function stateLabel(s){return t(s)}function card(r,buttons=false){let e=S.employees.find(x=>x.id===r.employeeId),own=S.employees.find(x=>x.name.toLowerCase()===(P?.full_name||'').toLowerCase()),del=r.status==='rejected'&&r.employeeId===own?.id;return`<div class="item"><b>${e?.name}</b> • ${fmt(r.from)} → ${fmt(r.to)}<br><span class="status ${r.status}">${stateLabel(r.status)}</span>${buttons&&r.status==='pending'?` <button onclick="decide('${r.id}','approved')">✅</button><button onclick="decide('${r.id}','rejected')">❌</button>`:''}${del?` <button onclick="delReq('${r.id}')">${t('del')}</button>`:''}</div>`}function renderLeave(){$('leaveEmp').innerHTML=S.employees.map(e=>`<option value="${e.id}">${e.name}</option>`).join('');let own=S.employees.find(e=>e.name.toLowerCase()===(P.full_name||'').toLowerCase());if(P.role==='worker'){$('leaveEmp').value=own.id;$('leaveEmp').disabled=true}$('myReq').innerHTML=S.leaveRequests.filter(r=>r.employeeId===own?.id).map(card).join('')||'—'}async function requestLeave(){let f=$('from').value,to=$('to').value,own=S.employees.find(e=>e.name.toLowerCase()===(P.full_name||'').toLowerCase());if(!f||!to)return;S.leaveRequests.push({id:crypto.randomUUID(),employeeId:P.role==='worker'?own.id:$('leaveEmp').value,from:f,to,status:'pending'});await save()}async function decide(id,status){let r=S.leaveRequests.find(x=>x.id===id);r.status=status;await save()}async function delReq(id){S.leaveRequests=S.leaveRequests.filter(x=>x.id!==id);await save()}function renderTeam(){$('teamBtns').innerHTML=S.employees.map(e=>`<button onclick="showTeam('${e.id}')">${e.name}</button>`).join('');if(!$('teamList').innerHTML)showTeam(S.employees[0].id)}function showTeam(id){$('teamList').innerHTML=S.leaveRequests.filter(r=>r.employeeId===id&&r.status==='approved').map(card).join('')||'—'}function renderApprovals(){if(['admin','supervisor'].includes(P.role))$('pending').innerHTML=S.leaveRequests.filter(r=>r.status==='pending').map(r=>card(r,true)).join('')||'—'}
function exportExcel(){let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['ShiftControlV601'],[JSON.stringify(S)]]),'BackupJSON');XLSX.writeFile(wb,'ShiftControl_v6.0.1.xlsx')}async function importExcel(e){let wb=XLSX.read(await e.target.files[0].arrayBuffer()),a=XLSX.utils.sheet_to_json(wb.Sheets.BackupJSON,{header:1});S=JSON.parse(a[1][0]);await save()}async function loadPublic(){let{data}=await db.from('public_status').select('*').eq('id',1).maybeSingle();window.PUB=data;renderPublic()}function renderPublic(){let w=window.PUB?.workers?.week||[],no=pubLang==='no';$('pubTitle').textContent=no?'Arbeidsplan':'Schedule';$('pubWeekTitle').textContent=no?'Denne uken':'This week';$('pubWeek').innerHTML=w.map(d=>`<div class="publicDay"><b>${no?d.no:d.en} ${d.label}</b>${d.shifts.map(x=>`<div>${x.name}: ${x.time}</div>`).join('')}</div>`).join('')}
