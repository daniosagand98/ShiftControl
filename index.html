<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ShiftControl v4</title><style>:root{--b:#176b9d;--n:#123a5a;--bg:#f2f6fa;--line:#d9e3eb;--r:#dc5244}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px system-ui;color:#17364c}header{background:linear-gradient(135deg,var(--n),var(--b));color:#fff;padding:15px;display:flex;gap:10px;align-items:center}.brand{font-size:21px;font-weight:900;flex:1}.layout{max-width:1100px;margin:auto;display:grid;grid-template-columns:220px 1fr;gap:16px;padding:16px}.side,.card{background:#fff;border-radius:18px;padding:15px;box-shadow:0 8px 25px #17364c12}.menu button{width:100%;border:0;background:#fff;text-align:left;padding:11px;border-radius:10px;font-weight:700}.menu button.on{background:#e7f2f9;color:var(--b)}.view{display:none}.view.on{display:block}.card{margin-bottom:14px}.hero{background:linear-gradient(135deg,#fff,#e8f5fb)}.time{font-size:44px;font-weight:950;color:var(--b)}.row{display:flex;gap:9px}.field{flex:1;margin:8px 0}.field label{display:block;font-size:12px;color:#6c8090}.field input,.field select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px}.btn{border:0;border-radius:10px;padding:10px 13px;background:var(--b);color:#fff;font-weight:800}.alt{background:#e8f0f6;color:var(--n)}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.day{border:1px solid var(--line);border-radius:12px;padding:8px;min-height:115px}.weekend{background:#f7f8fa}.shift{font-size:12px;padding:5px;border-radius:7px;margin:4px 0;border-left:5px solid var(--c);background:color-mix(in srgb,var(--c) 12%,white)}.item{border:1px solid var(--line);border-radius:11px;padding:10px;margin:7px 0}.status{padding:4px 8px;border-radius:99px;font-size:11px;font-weight:850}.pending{background:#fff1b9}.approved{background:#dff5e9}.rejected{background:#ffe0dc}.toast{position:fixed;right:15px;top:75px;padding:13px 16px;color:white;border-radius:12px;z-index:99;display:none}.toast.ok{display:block;background:#24975f}.toast.warn{display:block;background:#dc942d}.gate{position:fixed;inset:0;background:linear-gradient(145deg,var(--n),var(--b));display:flex;align-items:center;justify-content:center;z-index:100;padding:15px}.gate.hide{display:none}.login{background:white;border-radius:22px;padding:22px;width:min(430px,100%)}.langs button{border:1px solid #ffffff55;background:#ffffff18;color:#fff;padding:8px;border-radius:10px}.teamBtns{display:flex;gap:6px;flex-wrap:wrap}.teamBtns button{border:1px solid var(--line);background:white;border-radius:99px;padding:8px}.muted{font-size:12px;color:#6b7e8d}@media(max-width:800px){.layout{grid-template-columns:1fr}.week{grid-template-columns:1fr}.row{flex-direction:column}}</style></head><body><div id="toast" class="toast"></div><div id="gate" class="gate"><div class="login"><h1>📅 ShiftControl</h1><div class="field">Name / Imię<input id="name"></div><div class="field">E-mail<input id="email"></div><div class="field">Password / Hasło<input id="pass" type="password"></div><button class="btn" onclick="login()">Login</button> <button class="btn alt" onclick="signup()">Create account</button><p id="msg"></p></div></div><header><div class="brand">📅 ShiftControl v4</div><div class="langs"><button onclick="setLang('pl')">🇵🇱</button><button onclick="setLang('no')">🇳🇴</button></div></header><div class="layout"><aside class="side"><b id="pname"></b><div id="prole" class="muted"></div><nav class="menu"><button class="on" data-v="home" data-t="home">🏠 Start</button><button data-v="schedule" data-t="schedule">📅 Grafik</button><button data-v="leave" data-t="leave">🏖️ Wolne</button><button data-v="team" data-t="team">👥 Wolne zespołu</button><button class="editor" data-v="approvals" data-t="approvals">✅ Wnioski</button><button class="editor" data-v="edit" data-t="edit">🛠️ Edycja</button><button class="admin" data-v="users" data-t="users">⚙️ Konta</button><button onclick="logout()" data-t="logout">🚪 Wyloguj</button></nav></aside><main><section id="home" class="view on"><div class="card hero"><span id="hello"></span><h2 data-t="tomorrow">Jutro zaczynasz:</h2><div id="tomTime" class="time"></div><div id="tomDate" class="muted"></div></div><div class="card"><h2 data-t="upcoming">🏖️ Nadchodzące wolne</h2><div id="futureHome"></div></div></section><section id="schedule" class="view"><div class="card"><div class="row"><button class="btn alt" onclick="mv(-1)">‹</button><b id="weekLabel"></b><button class="btn alt" onclick="mv(1)">›</button></div><div id="week" class="week"></div></div></section><section id="leave" class="view"><div class="card"><h2 data-t="request">🏖️ Wyślij wniosek</h2><div class="field"><select id="leaveEmp"></select></div><div class="row"><div class="field"><label data-t="from">Od</label><input id="from" type="date"></div><div class="field"><label data-t="to">Do</label><input id="to" type="date"></div></div><button class="btn" onclick="requestLeave()" data-t="send">Wyślij</button></div><div class="card"><h2 data-t="myRequests">📋 Moje wnioski</h2><div id="myReq"></div></div></section><section id="team" class="view"><div class="card"><h2 data-t="team">👥 Wolne zespołu</h2><div id="teamBtns" class="teamBtns"></div><div id="teamList"></div></div></section><section id="approvals" class="view"><div class="card"><h2 data-t="approvals">✅ Wnioski</h2><div id="pending"></div></div></section><section id="edit" class="view"><div class="card"><h2 data-t="edit">🛠️ Edycja grafiku</h2><div class="row"><input id="edate" type="date"><select id="eemp"></select><select id="etime"><option>05:30</option><option>07:00</option><option>09:00</option><option value="OFF">OFF</option></select></div><button class="btn" onclick="editShift()" data-t="save">Zapisz</button></div></section><section id="users" class="view"><div class="card"><h2>⚙️ Roles</h2><div id="userList"></div></div></section></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const COL=['#277DA1','#F8961E','#43AA8B'];const T={pl:{home:'🏠 Start',schedule:'📅 Grafik',leave:'🏖️ Wolne',team:'👥 Wolne zespołu',approvals:'✅ Wnioski',edit:'🛠️ Edycja',users:'⚙️ Konta',logout:'🚪 Wyloguj',tomorrow:'Jutro zaczynasz:',upcoming:'🏖️ Nadchodzące wolne',request:'🏖️ Wyślij wniosek',from:'Od',to:'Do',send:'Wyślij',myRequests:'📋 Moje wnioski',save:'Zapisz',pending:'Oczekuje',approved:'Zatwierdzone',rejected:'Odrzucone',saved:'Zapisano',conflict:'Ktoś ma już wolne w tym terminie. Skontaktuj się z Kennethem. Wniosek oczekuje na decyzję.',week:'Tydzień',vakt:'Vakt',weekend:'Weekend wolny'},no:{home:'🏠 Start',schedule:'📅 Plan',leave:'🏖️ Fri',team:'👥 Teamets fri',approvals:'✅ Søknader',edit:'🛠️ Redigering',users:'⚙️ Kontoer',logout:'🚪 Logg ut',tomorrow:'I morgen starter du:',upcoming:'🏖️ Kommende fri',request:'🏖️ Send søknad',from:'Fra',to:'Til',send:'Send',myRequests:'📋 Mine søknader',save:'Lagre',pending:'Venter',approved:'Godkjent',rejected:'Avslått',saved:'Lagret',conflict:'Noen har allerede fri i perioden. Kontakt Kenneth. Søknaden venter på avgjørelse.',week:'Uke',vakt:'Vakt',weekend:'Fri i helgen'}};let sb,profile,L=localStorage.lang||'pl',wo=0,S={employees:[{id:'daniel',name:'Daniel',rotation:1},{id:'adam',name:'Adam',rotation:2},{id:'kevin',name:'Kevin',rotation:0}],overrides:[],leaveRequests:[]};const $=x=>document.getElementById(x),tr=k=>T[L][k]||k,iso=d=>{let x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10)},add=(d,n)=>{let x=new Date(d);x.setDate(x.getDate()+n);return x},mon=(d=new Date())=>{let x=new Date(d),n=(x.getDay()+6)%7;x.setDate(x.getDate()-n+wo*7);x.setHours(12,0,0,0);return x};function base(e,d){let w=Math.round((mon(d)-mon(new Date('2026-09-21T12:00')))/604800000);return['05:30','07:00','09:00'][((e.rotation-w)%3+3)%3]}function shift(e,d){let o=S.overrides.find(x=>x.date===iso(d)&&x.employee_id===e.id);return o?o.time:base(e,d)}function shown(e,d){if([0,6].includes(d.getDay()))return base(e,d)==='09:00'?'VAKT':'OFF';return shift(e,d)}function setLang(x){L=x;localStorage.lang=x;document.querySelectorAll('[data-t]').forEach(e=>e.textContent=tr(e.dataset.t));if(profile)render()}function toast(m,type='ok'){$('toast').textContent=m;$('toast').className='toast '+type;setTimeout(()=>$('toast').className='toast',3500)}function init(){sb=supabase.createClient(SHIFT.url,SHIFT.key,{auth:{persistSession:true,autoRefreshToken:true}})}async function signup(){let{error}=await sb.auth.signUp({email:$('email').value,password:$('pass').value,options:{data:{full_name:$('name').value}}});$('msg').textContent=error?error.message:'OK'}async function login(){let{data,error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('pass').value});if(error)return $('msg').textContent=error.message;enter(data.user)}async function enter(u){let{data:p}=await sb.from('profiles').select('*').eq('id',u.id).single();profile=p;if(!localStorage.getItem('lang')){L=['kevin','kenneth'].includes((p.full_name||'').toLowerCase())?'no':'pl';localStorage.lang=L}let{data:a}=await sb.from('app_state').select('payload').eq('id',1).maybeSingle();if(a?.payload)S={...S,...a.payload};S.leaveRequests=S.leaveRequests||[];$('gate').classList.add('hide');$('pname').textContent=p.full_name;$('prole').textContent=p.role;document.querySelectorAll('.editor').forEach(x=>x.style.display=['admin','supervisor'].includes(p.role)?'block':'none');document.querySelectorAll('.admin').forEach(x=>x.style.display=p.role==='admin'?'block':'none');setLang(L);if(p.role==='admin')loadUsers()}async function save(){let{error}=await sb.from('app_state').upsert({id:1,payload:S});if(error)return alert(error.message);render();toast(tr('saved'))}async function logout(){await sb.auth.signOut();location.reload()}document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.view,.menu button').forEach(x=>x.classList.remove('on'));$(b.dataset.v).classList.add('on');b.classList.add('on')});function mv(n){wo+=n;render()}function status(r){return `<span class="status ${r.status}">${tr(r.status)}</span>`}function card(r,buttons=false){let e=S.employees.find(x=>x.id===r.employee_id);return`<div class="item"><b>${e?.name}</b> • ${r.from} → ${r.to}<br>${status(r)}${buttons&&r.status==='pending'?` <button class="btn" onclick="decide('${r.id}','approved')">✅</button> <button class="btn alt" onclick="decide('${r.id}','rejected')">❌</button>`:''}</div>`}function render(){let fmt=L==='no'?'nb-NO':'pl-PL',m=mon(),tom=add(new Date(),1),me=S.employees.find(e=>e.name.toLowerCase()===(profile.full_name||'').toLowerCase())||S.employees[0],ts=shown(me,tom);$('tomTime').textContent=ts==='OFF'?tr('weekend'):ts==='VAKT'?tr('vakt'):ts;$('tomDate').textContent=tom.toLocaleDateString(fmt,{weekday:'long',day:'numeric',month:'long'});$('weekLabel').textContent=tr('week')+' • '+iso(m)+' – '+iso(add(m,6));$('week').innerHTML=[0,1,2,3,4,5,6].map(i=>{let d=add(m,i),we=[0,6].includes(d.getDay());return`<div class="day ${we?'weekend':''}"><b>${d.toLocaleDateString(fmt,{weekday:'short',day:'numeric'})}</b>${S.employees.map((e,j)=>{let sh=shown(e,d);return sh==='OFF'?'':`<div class="shift" style="--c:${COL[j]}">${e.name}: ${sh==='VAKT'?tr('vakt'):sh}</div>`}).join('')}</div>`}).join('');$('leaveEmp').innerHTML=$('eemp').innerHTML=S.employees.map(e=>`<option value="${e.id}">${e.name}</option>`).join('');let own=S.employees.find(e=>e.name.toLowerCase()===(profile.full_name||'').toLowerCase());if(profile.role==='worker'&&own){$('leaveEmp').value=own.id;$('leaveEmp').disabled=true}else $('leaveEmp').disabled=false;let mine=S.leaveRequests.filter(r=>r.employee_id===own?.id);$('myReq').innerHTML=mine.slice().reverse().map(r=>card(r)).join('');$('futureHome').innerHTML=mine.filter(r=>r.status==='approved'&&r.to>=iso(new Date())).map(r=>card(r)).join('')||'<div class="muted">—</div>';$('teamBtns').innerHTML=S.employees.map(e=>`<button onclick="team('${e.id}')">${e.name}</button>`).join('');if(!$('teamList').innerHTML)team(S.employees[0].id);if(['admin','supervisor'].includes(profile.role))$('pending').innerHTML=S.leaveRequests.filter(r=>r.status==='pending').map(r=>card(r,true)).join('')||'<div class="muted">—</div>'}function team(id){$('teamList').innerHTML=S.leaveRequests.filter(r=>r.employee_id===id&&r.status==='approved').map(r=>card(r)).join('')||'<div class="muted">—</div>'}async function requestLeave(){let f=$('from').value,to=$('to').value;if(!f||!to||to<f)return;let own=S.employees.find(e=>e.name.toLowerCase()===(profile.full_name||'').toLowerCase()),id=profile.role==='worker'?own.id:$('leaveEmp').value,conflict=S.leaveRequests.some(r=>r.employee_id!==id&&r.status==='approved'&&r.from<=to&&r.to>=f);S.leaveRequests.push({id:crypto.randomUUID(),employee_id:id,from:f,to,status:'pending'});await save();if(conflict)toast(tr('conflict'),'warn')}async function decide(id,st){let r=S.leaveRequests.find(x=>x.id===id);r.status=st;if(st==='approved')for(let d=new Date(r.from+'T12:00');iso(d)<=r.to;d=add(d,1)){S.overrides=S.overrides.filter(x=>!(x.date===iso(d)&&x.employee_id===r.employee_id));S.overrides.push({date:iso(d),employee_id:r.employee_id,time:'OFF'})}await save()}async function editShift(){let date=$('edate').value,id=$('eemp').value;S.overrides=S.overrides.filter(x=>!(x.date===date&&x.employee_id===id));S.overrides.push({date,employee_id:id,time:$('etime').value});await save()}async function loadUsers(){let{data}=await sb.from('profiles').select('*');$('userList').innerHTML=data.map(x=>`<div class="item">${x.full_name}<select onchange="role('${x.id}',this.value)"><option ${x.role==='viewer'?'selected':''}>viewer</option><option ${x.role==='worker'?'selected':''}>worker</option><option ${x.role==='supervisor'?'selected':''}>supervisor</option><option ${x.role==='admin'?'selected':''}>admin</option></select></div>`).join('')}async function role(id,r){await sb.rpc('admin_set_role',{target_id:id,new_role:r});loadUsers()}init();setLang(L);sb.auth.getSession().then(({data})=>{if(data.session)enter(data.session.user)});
</script></body></html>
